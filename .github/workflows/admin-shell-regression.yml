name: Admin Shell Regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  admin-shell:
    name: Admin shell checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium

      - name: Run shell state tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Run admin shell smoke tests
        run: npm run test:smoke
